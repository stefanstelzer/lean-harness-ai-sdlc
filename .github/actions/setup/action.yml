name: Setup
description: >
  Shared Node.js setup for the harness workflows. Assumes the calling job has
  already run actions/checkout. Pins Node from .nvmrc, enables the npm cache and
  installs dependencies with a reproducible `npm ci`.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
