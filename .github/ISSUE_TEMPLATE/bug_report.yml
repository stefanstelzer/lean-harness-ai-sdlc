name: 🐛 Bug report
description: Report something that is broken — kicks off the Bug flow.
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! This maps to the **Bug flow** in [WORKFLOW.md](../../WORKFLOW.md).
        The fix will start with `/bug-analysis` and a failing regression test.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, one-sentence description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, reliable reproduction steps.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behaviour
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, OS, package version / commit.
    validations:
      required: false
