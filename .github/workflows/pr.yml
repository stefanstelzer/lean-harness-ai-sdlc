name: PR Pipeline

# Full gate before merge (single package, no app matrix). Same checks as the
# push pipeline so the required "Verify" status check is produced on every PR.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Symlink checks (skills + rules)
        run: npm run check:links

      - name: Archgate compliance
        run: npm run archgate:ci

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,license
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Build
        run: npm run build

      - name: Test (with coverage)
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; let o='| Metric | % | Covered/Total |\n|---|---|---|\n'; for (const k of ['lines','statements','functions','branches']){const m=t[k]; o+='| '+k+' | '+m.pct+'% | '+m.covered+'/'+m.total+' |\n';} console.log(o);" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage/coverage-summary.json found — skipping coverage summary." >> "$GITHUB_STEP_SUMMARY"
          fi
