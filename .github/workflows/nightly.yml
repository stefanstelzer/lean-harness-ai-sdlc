name: Nightly Pipeline

# Validates main as a whole every night: repo-wide gates (symlink + archgate)
# plus the full test suite (incl. e2e) with coverage.
on:
  schedule:
    - cron: '0 2 * * *' # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    name: Full suite + e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup
        uses: ./.github/actions/setup

      - name: Symlink checks (skills + rules)
        run: npm run check:links

      - name: Archgate compliance
        run: npm run archgate:ci

      - name: Build
        run: npm run build

      - name: Full test suite with coverage
        # `vitest run --coverage` runs every suite, including tests/e2e.
        run: npm run test:coverage

      - name: E2E tests
        run: npm run test:e2e

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; let o='| Metric | % | Covered/Total |\n|---|---|---|\n'; for (const k of ['lines','statements','functions','branches']){const m=t[k]; o+='| '+k+' | '+m.pct+'% | '+m.covered+'/'+m.total+' |\n';} console.log(o);" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage/coverage-summary.json found — skipping coverage summary." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nightly-coverage
          path: coverage/
          retention-days: 14
