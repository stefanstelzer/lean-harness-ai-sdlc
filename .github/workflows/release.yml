name: Release

# Auto-semver release on every merge to main (single package). The bump level is
# decided in two layers:
#   1. A DETERMINISTIC floor from Conventional Commits since the last v* tag
#      (fix -> patch, feat -> minor, !/BREAKING -> major). Always reproducible.
#      Computed by `node scripts/semver-floor.mjs --print`.
#   2. An OPTIONAL agent refinement (decide-semver) that reads the diff and may
#      only RAISE the floor — runs only when ANTHROPIC_API_KEY is set.
# The release job applies max(floor, agent) via `semver-floor.mjs --apply`,
# bumps package.json, tags vX.Y.Z, cuts a GitHub Release and pushes a single
# `chore(release): ...` commit back to main. The plan job's subject guard plus
# the `[skip ci]` marker stop that bump commit from re-triggering a release.
on:
  push:
    branches: [main]

# Tag creation, GitHub Releases and the bump commit back to main.
permissions:
  contents: write

# Never cut two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Empty string when the secret is unset — gates the decide job below.
  HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.guard.outputs.release }}
      has_key: ${{ steps.guard.outputs.has_key }}
      floor: ${{ steps.floor.outputs.floor }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags so the Conventional-Commits range resolves.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Guard against re-trigger on the release bump commit
        id: guard
        run: |
          set -euo pipefail
          # env context is unavailable in job-level `if`, so surface key presence
          # as an output for the decide job to gate on.
          echo "has_key=$HAS_KEY" >> "$GITHUB_OUTPUT"
          SUBJECT="$(git log -1 --format=%s)"
          if printf '%s' "$SUBJECT" | grep -q '^chore(release)'; then
            echo "HEAD is a release commit ($SUBJECT); nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute Conventional-Commits semver floor
        id: floor
        if: steps.guard.outputs.release == 'true'
        run: |
          set -euo pipefail
          # semver-floor.mjs --print emits `floor=<patch|minor|major>` on stdout
          # (empty when there is nothing release-worthy since the last tag).
          FLOOR="$(node scripts/semver-floor.mjs --print | awk -F= '/^floor=/{print $2}')"
          echo "Computed floor: ${FLOOR:-<none>}"
          echo "floor=${FLOOR}" >> "$GITHUB_OUTPUT"

  # Diff-aware refinement. Skipped entirely when ANTHROPIC_API_KEY is unset
  # (the deterministic floor is then used as-is).
  decide:
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' && needs.plan.outputs.has_key == 'true' && needs.plan.outputs.floor != '' }}
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.collect.outputs.bump }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Decide bump (agent may only RAISE the floor)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: '/decide-semver'
          claude_args: >-
            --max-turns 12
            --allowedTools "Bash(git log:*),Bash(git diff:*),Bash(git describe:*),Bash(git show:*),Read,Write"

      - name: Collect decision
        id: collect
        run: |
          set -euo pipefail
          BUMP=""
          if [ -f .semver-decision.json ]; then
            BUMP="$(node -e "try{process.stdout.write(String(require('./.semver-decision.json').bump||''))}catch{}")"
          fi
          echo "Agent decision: ${BUMP:-<none>}"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"

  release:
    needs: [plan, decide]
    # Release whenever there is something to release and decide didn't fail;
    # decide is legitimately "skipped" when ANTHROPIC_API_KEY is unset.
    if: ${{ !cancelled() && needs.plan.outputs.release == 'true' && needs.plan.outputs.floor != '' && needs.decide.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Bump, commit, tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLOOR: ${{ needs.plan.outputs.floor }}
          AGENT_BUMP: ${{ needs.decide.outputs.bump }}
        run: |
          set -euo pipefail
          # Take the stronger of the deterministic floor and the agent bump
          # (the agent may only RAISE the level, never lower it).
          if [ -n "${AGENT_BUMP:-}" ]; then
            LEVEL="$(node scripts/semver-floor.mjs --max "$FLOOR" "$AGENT_BUMP" | cut -d= -f2)"
          else
            LEVEL="$FLOOR"
          fi
          LEVEL="${LEVEL:-$FLOOR}"
          echo "Applying bump level: $LEVEL"

          node scripts/semver-floor.mjs --apply "$LEVEL"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::notice::Tag $TAG already exists; nothing to release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): $TAG [skip ci]"

          # main may have advanced since checkout — replay our bump on top.
          git fetch origin main
          git rebase origin/main
          git tag -a "$TAG" -m "Release $TAG"
          git push origin HEAD:main
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes
          echo "::notice::Released $TAG"
