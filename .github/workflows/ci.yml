name: CI Pipeline

# The single pipeline for this repo: runs on every push and every pull request
# (single package, no app matrix). It produces the required "Verify" status check
# that the protect-main ruleset gates on. There is no separate release, nightly,
# or push/PR split — this one workflow is the whole CI surface.
#
# Fast gates: lint -> symlink checks -> plugin sync -> archgate -> Trivy ->
# build -> unit + smoke tests with coverage. The e2e suite (tests/e2e) is run
# on demand, not here (see GEN-002).
on:
  push:
  pull_request:
    # `edited` is included so a PR whose body is fixed without a new push
    # re-runs the GEN-006 Manual Test Plan body check below.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Symlink checks (skills + commands + rules)
        run: npm run check:links

      - name: Plugin artefact sync
        run: npm run check:plugins

      - name: PR body — Manual Test Plan (GEN-006)
        # Only pull_request events carry a PR body; a no-op on push.
        if: github.event_name == 'pull_request'
        run: npm run check:pr-body

      - name: Archgate compliance
        run: npm run archgate:ci

      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,license
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Build
        run: npm run build

      - name: Test (unit + smoke, with coverage)
        # e2e (tests/e2e) is intentionally excluded from CI — see GEN-002.
        run: npx vitest run --coverage tests/unit tests/smoke

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; let o='| Metric | % | Covered/Total |\n|---|---|---|\n'; for (const k of ['lines','statements','functions','branches']){const m=t[k]; o+='| '+k+' | '+m.pct+'% | '+m.covered+'/'+m.total+' |\n';} console.log(o);" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage/coverage-summary.json found — skipping coverage summary." >> "$GITHUB_STEP_SUMMARY"
          fi
