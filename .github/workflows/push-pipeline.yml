name: Push Pipeline

# Mirrors the "Push pipeline" lane in WORKFLOW.md: fast feedback on every push.
on:
  push:
    branches-ignore:
      - 'gh-pages'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Archgate
        run: npm run archgate

      - name: Unit tests
        run: npm run test:unit
